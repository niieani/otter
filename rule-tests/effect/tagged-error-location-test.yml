id: tagged-error-location

valid:
  - |
    import { HelloError } from "../errors";
    Effect.fail(new HelloError({ reason: "test" }));
  - |
    const result = Effect.catchTag("HelloError", (e) => Effect.succeed(fallback));
  - |
    import { ApiError } from "../errors";
    Effect.fail(new ApiError({ message: "test" }));

invalid:
  - |
    class HelloError extends Schema.TaggedErrorClass<HelloError>()("HelloError", {
      reason: Schema.String,
    }) {}
  - |
    export class FetchError extends Schema.TaggedErrorClass<FetchError>()("FetchError", {
      url: Schema.String,
      status: Schema.Number,
    }) {
      get message() {
        return `Fetch failed: ${this.url}`;
      }
    }
  - |
    class ApiError extends Schema.TaggedErrorClass<ApiError>()("ApiError", {
      message: Schema.String,
    }) {}
  - |
    export class RpcError extends Schema.TaggedErrorClass<RpcError>()("RpcError", {
      code: Schema.Number,
    }) {}
