id: no-json-parse-without-schema

valid:
  - |
    const data = yield* Schema.decodeUnknownEffect(MySchema)(JSON.parse(body));
  - |
    const data = Schema.decodeUnknownSync(MySchema)(JSON.parse(body));
  - |
    const data = yield* Schema.decodeEffect(MySchema)(JSON.parse(body));
  - |
    const data = Schema.decodeSync(MySchema)(JSON.parse(body));
  - |
    const result = Schema.decodeUnknownExit(MySchema)(JSON.parse(body));
  - |
    const result = Schema.decodeExit(MySchema)(JSON.parse(body));

invalid:
  - |
    const data = JSON.parse(body);
  - |
    const config = JSON.parse(content);
  - |
    return JSON.parse(await response.text());
  - |
    const raw = JSON.parse(body);
    const data = yield* Schema.decodeUnknownEffect(MySchema)(raw);
